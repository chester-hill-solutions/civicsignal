name: Railway config

# Every change to `.railway/` is planned on the pull request and applied when it
# merges. The plan is the review; the merge is the approval.
#
# The apply job does not re-evaluate the authoring file. It applies the plan that
# was reviewed, against the environment state that plan was computed from — so a
# dashboard edit between the plan and the merge fails the apply instead of
# silently overwriting it.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"
      - "services/**"
  push:
    branches: [main]
    paths:
      - ".railway/**"
      - "services/**"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The IaC is evaluated by the SDK, so the SDK has to be installed. The
      # authoring file is TypeScript and the CLI evaluates it natively.
      - name: Install the authoring SDK
        run: bun install --frozen-lockfile
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install the authoring SDK
        run: bun install --frozen-lockfile
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
