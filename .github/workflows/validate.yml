name: Validate release candidate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build and local checks must never contact production bindings.
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CIVICSIGNAL_WORKERD_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install the exact clean-checkout dependency graph
        run: bun install --frozen-lockfile
      - name: Check every runtime, tests, and invariants
        run: bun run validate
      - name: Check the protected-copy process owner
        run: python3 -I -B test/protected-state-d1-owned.test.py
      - name: Bundle every Cloudflare Worker without deployment
        run: bun run build
